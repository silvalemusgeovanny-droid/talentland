<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reparaciones | Inventario y Reparaciones</title>
    <link rel="stylesheet" href="styles.css?v=single-navigation-1" />
  </head>
  <body class="parts-page">
    <main class="parts-shell">
      <header class="parts-header">
        <div>
          <span class="panel-kicker">Servicio tecnico</span>
          <h1>Reparaciones</h1>
          <p>Consulta las 50 reparaciones mas recientes.</p>
        </div>
        <a class="back-link header-panel-link" href="index.html" data-return-module="repairs">Panel</a>
      </header>

      <section class="parts-summary" aria-label="Resumen de reparaciones">
        <article>
          <span>Total reparaciones</span>
          <strong id="totalRepairs">0</strong>
        </article>
        <article>
          <span>Valor registrado</span>
          <strong id="totalRepairValue">$0.00</strong>
        </article>
        <article>
          <span>Entregadas</span>
          <strong id="totalDelivered">0</strong>
        </article>
      </section>

      <section class="parts-table-card repairs-table-card">
        <div class="table-toolbar">
          <div>
            <span class="panel-kicker">Consulta</span>
            <h2>Registros de reparaciones</h2>
          </div>
          <input id="repairSearch" type="search" placeholder="Buscar cliente, modelo o reparacion" />
        </div>

        <div class="table-wrap">
          <table class="repairs-table">
            <thead>
              <tr>
                <th>No.</th>
                <th>Cliente</th>
                <th>Equipo</th>
                <th>Modelo</th>
                <th>Reparacion</th>
                <th>Precio</th>
                <th>Estado</th>
                <th>Ingreso</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="repairsTable"></tbody>
          </table>
        </div>
      </section>

      <div class="date-time" aria-label="Fecha y hora actual">
        <span id="currentDate">--/--/----</span>
        <span id="currentTime">--:--</span>
      </div>

      <button
        class="color-mode-toggle"
        type="button"
        id="colorModeToggle"
        aria-label="Cambiar a modo noche"
        aria-pressed="false"
        title="Cambiar a modo noche"
      >
        <svg class="mode-icon moon-icon" aria-hidden="true" viewBox="0 0 24 24">
          <path
            d="M20.3 15.4A8.2 8.2 0 0 1 8.6 3.7a8.9 8.9 0 1 0 11.7 11.7Z"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.4"
          />
        </svg>
        <svg class="mode-icon sun-icon" aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2.4" />
          <path
            d="M12 2.2v2.2M12 19.6v2.2M4.4 4.4 6 6M18 18l1.6 1.6M2.2 12h2.2M19.6 12h2.2M4.4 19.6 6 18M18 6l1.6-1.6"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="2.4"
          />
        </svg>
      </button>
    </main>

    <script src="convex-config.js?v=parts-model-1"></script>
    <script src="app-core.js?v=shared-parts-1"></script>
    <script src="convex-client.js?v=shared-session-1"></script>
    <script src="pending-notes.js?v=shared-session-1"></script>
    <script src="page-nav.js?v=single-navigation-1"></script>
    <script src="reparaciones.js?v=repairs-list-50-1"></script>
  </body>
</html>
